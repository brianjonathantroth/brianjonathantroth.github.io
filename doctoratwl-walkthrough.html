<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Use Doctorat WL — Teacher Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF6EE;
    --paper:#FFFFFF;
    --ink:#1F2A24;
    --ink-soft:#5B665F;
    --brass:#B8925A;
    --brass-deep:#8C6B3D;
    --forest:#2F4F3E;
    --forest-soft:#E7EEE9;
    --line:#E4DECF;
    --danger:#B4452F;
    --danger-bg:#F7E9E4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2.5rem 1.25rem;
  }
  .shell{
    width:100%;
    max-width:760px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(31,42,36,0.04);
  }
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.1rem 1.5rem;
    border-bottom:1px solid var(--line);
    background:var(--paper);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:0.6rem;
  }
  .brand svg{flex-shrink:0;}
  .brand-text{display:flex;flex-direction:column;line-height:1.1;}
  .brand-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:0.01em;
  }
  .brand-sub{
    font-size:0.72rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-top:1px;
  }
  .pages{
    display:flex;
    gap:5px;
  }
  .page-mark{
    width:14px;
    height:18px;
    border-radius:2px;
    border:1.5px solid var(--line);
    background:transparent;
    transition:background .25s ease, border-color .25s ease;
  }
  .page-mark.done{background:var(--forest);border-color:var(--forest);}
  .page-mark.current{border-color:var(--brass);background:var(--brass);}
  @media (prefers-reduced-motion: reduce){.page-mark{transition:none;}}

  .stage{
    padding:2.75rem 2.5rem 2.25rem;
    min-height:380px;
  }
  @media (max-width:600px){
    .stage{padding:2rem 1.35rem 1.75rem;}
  }
  .eyebrow{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--brass-deep);
    font-weight:600;
    margin:0 0 0.6rem;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:2.1rem;
    line-height:1.15;
    margin:0 0 0.85rem;
  }
  h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.55rem;
    line-height:1.2;
    margin:0 0 0.85rem;
  }
  p{
    font-size:0.98rem;
    line-height:1.65;
    color:var(--ink-soft);
    margin:0 0 1rem;
  }
  .lead{font-size:1.05rem;color:var(--ink);}

  .bars{
    display:flex;
    align-items:flex-end;
    gap:10px;
    height:76px;
    margin:1.75rem 0 0.5rem;
  }
  .bar{
    width:34px;
    border-radius:4px 4px 0 0;
    background:var(--forest-soft);
    position:relative;
  }
  .bar span{
    position:absolute;
    bottom:-22px;
    left:0;
    right:0;
    text-align:center;
    font-size:0.68rem;
    color:var(--ink-soft);
  }
  .bar.on{background:var(--brass);}

  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1.75rem;
  }
  @media (max-width:600px){.grid2{grid-template-columns:1fr;}}

  .field-label{
    display:flex;
    align-items:center;
    gap:0.5rem;
    font-weight:600;
    font-size:0.95rem;
    margin-bottom:0.5rem;
  }
  .badge{
    font-size:0.65rem;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .badge.req{background:var(--danger-bg);color:var(--danger);}
  .badge.opt{background:var(--forest-soft);color:var(--forest);}

  .mock-box{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:0.9rem 1rem;
    font-size:0.85rem;
    color:var(--ink-soft);
    background:#FDFCF9;
    min-height:64px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:0.4rem;}
  .chip{
    border:1px solid var(--line);
    border-radius:8px;
    padding:0.5rem 0.9rem;
    font-size:0.85rem;
    background:#FDFCF9;
  }
  .chip.ex{border-color:var(--brass);background:#FBF3E8;color:var(--brass-deep);font-weight:600;}

  .tip{
    display:flex;
    gap:0.7rem;
    background:var(--forest-soft);
    border-radius:10px;
    padding:0.9rem 1.05rem;
    margin-top:1.1rem;
  }
  .tip svg{flex-shrink:0;margin-top:2px;}
  .tip p{margin:0;color:var(--forest);font-size:0.87rem;}

  .notice-list{display:flex;flex-direction:column;gap:0.7rem;margin-top:0.25rem;}
  .notice{
    display:flex;
    gap:0.7rem;
    border:1px solid var(--line);
    border-radius:10px;
    padding:0.85rem 1rem;
  }
  .notice svg{flex-shrink:0;margin-top:2px;}
  .notice p{margin:0;font-size:0.88rem;color:var(--ink-soft);}
  .notice strong{color:var(--ink);}

  .checklist{list-style:none;margin:0.5rem 0 0;padding:0;display:flex;flex-direction:column;gap:0.55rem;}
  .checklist li{display:flex;align-items:flex-start;gap:0.6rem;font-size:0.92rem;color:var(--ink);}
  .checklist svg{flex-shrink:0;margin-top:3px;}

  .footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.1rem 1.5rem;
    border-top:1px solid var(--line);
  }
  button{
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    font-weight:600;
    border-radius:8px;
    padding:0.65rem 1.3rem;
    cursor:pointer;
    transition:transform .12s ease, opacity .15s ease;
  }
  button:focus-visible{outline:2px solid var(--brass-deep);outline-offset:2px;}
  button:active{transform:scale(0.98);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{background:var(--cream);}
  .btn-primary{background:var(--brass);border:1px solid var(--brass);color:#FFFFFF;}
  .btn-primary:hover{background:var(--brass-deep);border-color:var(--brass-deep);}
  .btn-hide{visibility:hidden;}
  a.btn-primary{text-decoration:none;display:inline-block;}
  @media (prefers-reduced-motion: reduce){button{transition:none;}}

  .hotspot-wrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:0.75rem;}
  .hotspot-wrap img{display:block;width:100%;height:auto;}
  .hotspot{
    position:absolute;
    border:2px solid var(--brass);
    border-radius:8px;
    background:rgba(184,146,90,0.12);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .hotspot:hover{background:rgba(184,146,90,0.22);}
  .hotspot.found{border-color:var(--forest);background:rgba(47,79,62,0.12);cursor:default;}
  .hotspot-counter{font-size:0.82rem;color:var(--ink-soft);margin-top:0.65rem;}
  .hotspot-note{
    margin-top:0.75rem;
    background:var(--forest-soft);
    border-radius:8px;
    padding:0.7rem 0.9rem;
    font-size:0.85rem;
    color:var(--forest);
    min-height:1.2rem;
  }

  .quiz-q{margin-bottom:1.5rem;}
  .quiz-q:last-child{margin-bottom:0;}
  .quiz-q p.q-text{font-weight:600;color:var(--ink);margin-bottom:0.6rem;font-size:0.95rem;}
  .quiz-opts{display:flex;flex-direction:column;gap:0.5rem;}
  .quiz-opt{
    text-align:left;
    border:1px solid var(--line);
    background:#FDFCF9;
    border-radius:8px;
    padding:0.6rem 0.85rem;
    font-size:0.87rem;
    font-weight:400;
    color:var(--ink);
  }
  .quiz-opt:hover:not(.correct):not(.incorrect){background:var(--cream);}
  .quiz-opt.correct{border-color:var(--forest);background:var(--forest-soft);color:var(--forest);font-weight:600;}
  .quiz-opt.incorrect{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);font-weight:600;}
  .quiz-feedback{font-size:0.82rem;color:var(--ink-soft);margin-top:0.4rem;min-height:1.1rem;}
</style>
</head>

<div class="shell">
  <div class="header">
    <div class="brand">

  <div class="footer">
    <button class="btn-ghost" id="backBtn">Back</button>
    <button class="btn-primary" id="nextBtn">Next</button>
  </div>
</div>

let i = 0;
const stage = document.getElementById('stage');
const pagesEl = document.getElementById('pages');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');

function renderPages(){
  pagesEl.innerHTML = screens.map((_,idx)=>{
    const cls = idx < i ? 'done' : idx === i ? 'current' : '';
    return `<div class="page-mark ${cls}"></div>`;
  }).join('');
}

function wireHotspots(){
  const hotspots = stage.querySelectorAll('.hotspot');
  if (!hotspots.length) return;
  const counter = stage.querySelector('#hsCounter');
  const note = stage.querySelector('#hsNote');
  let found = 0;
  hotspots.forEach(h => {
    h.addEventListener('click', () => {
      if (h.classList.contains('found')) return;
      h.classList.add('found');
      found++;
      counter.textContent = found + ' of ' + hotspots.length + ' found';
      note.textContent = h.dataset.name + ': ' + h.dataset.note;
    });
  });
}

function wireQuiz(){
  const questions = stage.querySelectorAll('.quiz-q');
  if (!questions.length) return;
  questions.forEach(q => {
    const opts = q.querySelectorAll('.quiz-opt');
    const feedback = q.querySelector('.quiz-feedback');
    opts.forEach(opt => {
      opt.addEventListener('click', () => {
        if (opt.disabled) return;
        const isCorrect = opt.dataset.correct === 'true';
        opt.classList.add(isCorrect ? 'correct' : 'incorrect');
        feedback.textContent = isCorrect ? 'Correct.' : 'Not quite, the highlighted option below is the one to remember.';
        opts.forEach(o => { o.disabled = true; if (o.dataset.correct === 'true') o.classList.add('correct'); });
      });
    });
  });
}

function render(){
  stage.innerHTML = screens[i].body;
  renderPages();
  backBtn.classList.toggle('btn-hide', i === 0);
  nextBtn.classList.toggle('btn-hide', i === screens.length - 1);
  stage.scrollTop = 0;
  wireHotspots();
  wireQuiz();
}

nextBtn.addEventListener('click', () => { if (i < screens.length - 1) { i++; render(); } });
backBtn.addEventListener('click', () => { if (i > 0) { i--; render(); } });

render();
</script>
