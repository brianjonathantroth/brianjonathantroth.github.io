<style>

:root[data-theme="dark"]{

.stage{max-width:860px;margin:0 auto;background:var(--stage);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px var(--shadow);padding-block:32px 36px;padding-inline:clamp(18px,4.5vw,52px);overflow:clip;--surface:var(--bg)}

}

function portrait(id, cls="portrait"){
  if (PHOTOS[id]) return `<img class="${cls} photo" src="${PHOTOS[id]}" alt="" width="360" height="360">`;
  const p = PEOPLE[id];
  const hair = p.kind==="scarf"
    ? `<path d="M30 62 C28 30 92 30 90 62 L94 98 C80 108 40 108 26 98 Z" fill="${p.scarf}"/>`
    : p.kind==="short"
      ? `<path d="M38 50 C38 30 82 30 82 50 C78 40 42 40 38 50 Z" fill="${p.hair}"/>`
      : `<path d="M37 54 C34 28 86 26 84 52 C76 40 56 38 44 46 C42 50 40 54 37 54 Z" fill="${p.hair}"/>`;
  const face = p.kind==="scarf" ? `<ellipse cx="60" cy="60" rx="19" ry="22" fill="${p.skin}"/>` : `<circle cx="60" cy="58" r="22" fill="${p.skin}"/>`;
  return `<svg class="${cls}" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="60" style="fill:var(--teal-soft)"/>
    <path d="M18 120 C20 92 40 84 60 84 C80 84 100 92 102 120 Z" fill="${p.shirt}"/>
    <rect x="52" y="72" width="16" height="16" rx="6" fill="${p.skin}"/>
    ${p.kind==="scarf"?hair+face:face+hair}
    <g class="blink" style="transform-box:fill-box;transform-origin:center"><circle cx="52" cy="60" r="2.6" fill="#1A1A1A"/><circle cx="68" cy="60" r="2.6" fill="#1A1A1A"/></g>
    <path d="M53 70 Q60 75 67 70" stroke="#1A1A1A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    ${p.badge?`<path d="M50 86 L60 104 L70 86" stroke="#FFFFFF" stroke-width="2" fill="none"/><rect x="54" y="102" width="12" height="9" rx="2" fill="#FFFFFF"/>`:""}
  </svg>`;
}

const pill = (x,y,cls="pill-ic") => `<g class="mk" style="animation-delay:${(x/600).toFixed(2)}s"><rect x="${x-7}" y="${y-4}" width="14" height="8" rx="4" class="${cls}"/></g>`;
const shot = (x,y,delay) => `<g class="mk" style="animation-delay:${delay}s"><rect x="${x-3}" y="${y-13}" width="6" height="20" rx="2" class="shot-ic"/><rect x="${x-6}" y="${y-15}" width="12" height="3" rx="1.5" class="shot-ic"/><rect x="${x-1}" y="${y+7}" width="2" height="7" class="shot-ic"/></g>`;
function calendar(){
  const L=150, W=600, mw=(W-L)/12, M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const cx = m => L + mw*m + mw/2;
  const rows=[["Daily pill","F/TDF or F/TAF",60],["Every 2 months","Cabotegravir",115],["Every 6 months","Lenacapavir",170]];
  let g = M.map((m,i)=>`<text x="${cx(i)}" y="22" text-anchor="middle" font-size="12" class="mut">${m}</text><line x1="${L+mw*i}" y1="32" x2="${L+mw*i}" y2="196" style="stroke:var(--line)"/>`).join("");
  g += rows.map(r=>`<text x="0" y="${r[2]-2}" font-size="14" font-weight="700">${r[0]}</text><text x="0" y="${r[2]+15}" font-size="12" class="mut">${r[1]}</text>`).join("");
  g += `<rect class="bar" x="${L+4}" y="54" width="${W-L-8}" height="12" rx="6" style="fill:var(--teal);opacity:.25"/>`;
  for(let m=0;m<12;m++) g += pill(cx(m),60);
  [0,1,3,5,7,9,11].forEach((m,i)=> g += shot(cx(m),115,(0.4+i*0.18).toFixed(2)));
  [0,6].forEach((m,i)=> g += shot(cx(m),170,(1.8+i*0.5).toFixed(2)));
  g += `<text x="${L+cx(0)-L+16}" y="196" font-size="11" class="mut">Jan: starter shots + 2 days of tablets</text>`;
  return `<div class="cal-wrap"><svg class="cal" viewBox="0 0 ${W} 205" role="img" aria-labelledby="calT calD"><title id="calT">One year of PrEP</title><desc id="calD">A daily pill is taken every day. Cabotegravir is two starter shots a month apart, then a shot every two months, about seven shots in the first year. Lenacapavir is a shot every six months, two shots a year, after starter tablets.</desc>${g}</svg></div>`;
}

   <rect x="490" y="36" width="130" height="54" rx="6" style="fill:var(--accent)"/>

const scenarioA = {
  id: "marcus", name: "Marcus", initial: "M", cls: "",
  setup: "Marcus, a 26-year-old man, walks into your community testing site for the weekly free clinic on a Thursday evening. He signs in for a rapid HIV test and tells you he has plans soon after.",
  steps: [
    { lines: [["Marcus","I just want the test. I'm kind of in a hurry, so can we do this fast?"]],
      prompt: "What do you say?",
      options: [
        {t:"\"Of course. While the test runs, I ask everyone the same few questions about sexual health so we can see if anything else would help you. Is that okay?\"", r:"best",
         f:"This uses the test's wait time, frames the questions as routine for everyone, and asks permission. Marcus keeps control of the conversation, which makes him more likely to say yes."},
        {t:"\"Before we test, I need to go over your risk factors.\"", r:"okay",
         f:"The questions still happen, but \"risk factors\" can sound like a judgment about Marcus as a person. Framing the questions as routine for every client gets the same information with less defensiveness."},
        {t:"Skip the questions and run the test.", r:"miss",
         f:"Marcus gets his result, but the visit ends without anyone learning whether PrEP, STI testing, or other services fit his life. For many clients, this visit is the only contact with prevention services all year."}
      ]},
    { lines: [["Marcus","Fine, go ahead."]],
      prompt: "You start with partners. Which question do you ask?",
      options: [
        {t:"\"Are you seeing a girlfriend right now?\"", r:"miss",
         f:"This assumes the gender of Marcus's partners. If the assumption is wrong, he now has to correct you before he can answer, and many clients simply won't."},
        {t:"\"Are you having sex with anyone right now? What are the genders of your partners?\"", r:"best",
         f:"This mirrors the CDC's guide to taking a sexual history. It's direct, it's neutral, and it asks about partners without guessing."},
        {t:"\"Have you had any risky sex lately?\"", r:"okay",
         f:"Risk is subjective and means different things to different people. Instead, ask about specific practices and protection."}
      ]},
    { lines: [["Marcus","Yeah. Guys, mostly."]],
      prompt: "Next, you ask about protection and past testing. Which question do you ask?",
      options: [
        {t:"\"Do you use condoms?\"", r:"okay",
         f:"This is a yes-or-no question, so you'll likely get a one-word answer. Marcus says \"yeah\" and the conversation stalls before you learn how often, or what else has happened."},
        {t:"\"Thanks. When you have sex, how do you usually protect yourself? And have you been tested or treated for any STIs in the past year?\"", r:"best",
         f:"Open-ended questions about protection and past testing give Marcus room to answer in his own words. Asking about testing and treatment as routine makes it easier for him to mention something he might not raise on his own."},
        {t:"\"I'm guessing you've had an STI before?\"", r:"miss",

      ]},
    { lines: [["Marcus","Condoms, usually. Not always, I guess."],["Marcus","I did get a shot a few weeks back. Gonorrhea."]],
      prompt: "A bacterial STI in the past six months is one of the signs that a client could benefit from PrEP. What's your next move?",
      options: [
        {t:"\"Thanks for telling me. Because you've had an STI in the past six months, CDC guidelines say PrEP could be a good fit for you. PrEP is medicine that prevents HIV, and there are different options for taking it that fit your routine. Would you like to meet our PrEP navigator tonight?\"", r:"best",
         f:"You thank him for the disclosure and tell him why PrEP fits his situation, so the recommendation is about him rather than a script. Then you explain PrEP in one sentence, note that options fit different routines, and offer a warm handoff to a navigator he can meet today, which is less likely to be ignored than a brochure."},
        {t:"\"You really should be using condoms every time.\"", r:"miss",
         f:"Marcus just shared something personal, and this response shames him. This makes clients less likely to come back. The CDC guide recommends giving positive feedback on whatever prevention a client already uses."},
        {t:"Hand him a PrEP brochure with the clinic's number on it.", r:"okay",

      ]}
  ]

   <h1>The right questions for the right care</h1>
   <p class="lede">In 2024, only half of U.S. healthcare providers surveyed were aware of the CDC's PrEP guidelines, down from 57% the year before (Bhushan et al., 2026). In one survey of primary care providers, only 39% said they start conversations about PrEP with their patients (Sell et al., 2023). When clinicians don't raise it, an intake conversation may be a client's best chance to hear about a medicine that prevents HIV. This module helps you make that conversation count.</p>
   <div class="meta-row"><span class="chip">Audience: intake, testing, and outreach staff</span><span class="chip">Format: self-paced</span><span class="chip">No clinical license required</span></div>
   <div class="panel">
     <h3>Competency</h3>
     <p>Prevention staff conduct a brief, nonjudgmental sexual health intake that identifies PrEP and testing needs and connects clients to care the same day.</p>
   </div>
   <div class="panel">
     <h3>By the end, you will be able to</h3>
     <ol class="obj">
       <li>Open a sexual health conversation with a universal, permission-based statement.</li>
       <li>Ask about partners and practices using neutral, behavior-based language.</li>
       <li>Identify at least two intake details that suggest a client could benefit from PrEP.</li>
       <li>Describe the current PrEP options in plain language, including twice-yearly injections.</li>
       <li>Close with a warm handoff to testing or PrEP navigation.</li>
     </ol>
   </div>
   ${note("Analysis", "Built for staff who are often the first and only point of contact. Objectives are written as observable behaviors so they can be checked in a role-play or chart audit, not just a quiz. Scenarios draw on patient intake volunteering at a community STI clinic.")}
 `},
 { key:"why", label:"Why it matters", render: () => `
   <p class="eyebrow">Objective 1</p>
   <h2>Make it routine, and make it everyone's</h2>
   <p>The CDC recommends that every sexually active adult and adolescent be told about PrEP. Neutral, direct language promotes open communication with the patient and reduces assumptions based on their appearance, who accompanied them to their appointment, or what you guess about them.</p>
   <div class="say">"I ask these questions to all my patients, regardless of age, gender, or marital status."<cite>Suggested opening, CDC Guide to Taking a Sexual History</cite></div>
   <p>Ask permission to pose follow-up questions about sexual health. A client who agreed to the conversation answers more openly than a client who was told it was required.</p>
   <div class="panel"><h3>Try it in your own words</h3><p class="muted">Before you move on, say an opening line out loud the way you'd actually say it at your site. Short is fine. It should include three things: <b>everyone gets these questions</b>, <b>why you ask</b>, and <b>a request for permission</b>.</p></div>
   ${note("Objective 1 · Practice", "Rehearsing aloud is a deliberate low-stakes retrieval step before the scenarios. In a live or virtual cohort, this becomes a 60-second pair-share.")}
 `},
 { key:"fiveps", label:"The 5 Ps", render: () => `
   <p class="eyebrow">Objective 2</p>
   <h2>Five areas, in plain language</h2>
   <p>The CDC's 5 Ps are a memory aid for what to cover during sexual health conversations with patients. You don't need every question every time. Select each P to see a question you can use word for word.</p>
   <div class="ps" role="group" aria-label="The five Ps">
     ${[["Partners","\"Are you currently having sex of any kind, oral, vaginal, or anal, with anyone? What are the genders of your partners?\""],
        ["Practices","\"Do you meet partners online or through apps? Have you ever exchanged sex for things you need, like money or housing?\""],
        ["Protection","\"Have you heard of PrEP, a medicine that can prevent HIV? Have you used it or thought about it?\""],
        ["Past history","\"Have you ever been tested for HIV or other STIs? Would you like to be tested today?\""],
        ["Pregnancy intention","\"Do you think you'd like to have children, or more children, at some point?\""]]
       .map((p,i)=>`<button class="p-btn" aria-expanded="false" aria-controls="pq" data-q='${p[1].replace(/'/g,"&#39;")}' data-n="${p[0]}">${ICONS[p[0]]}<b>P${i+1}</b><span>${p[0]}</span></button>`).join("")}
   </div>
   <div class="say" id="pq" aria-live="polite">Select a P to see a sample question.</div>
   ${note("Objective 2 · 508", "Each P is a real button with aria-expanded, and the revealed text sits in a live region so screen-reader users hear it without hunting for it. Sample questions are quoted or lightly adapted from the CDC guide.")}
 `, after: el => {
    el.querySelectorAll(".p-btn").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".p-btn").forEach(x => x.setAttribute("aria-expanded","false"));
      b.setAttribute("aria-expanded","true");
      $("#pq", el).innerHTML = `<b>${b.dataset.n}:</b> ${b.dataset.q}`;
    }));

 { key:"swap", label:"Language check", render: () => `
   <p class="eyebrow">Objective 2 · Practice</p>
   <h2>Which would you say?</h2>
   <p>Pick the phrasing that gets a more honest answer.</p>
   ${swaps.map((s,i)=>`
     <fieldset class="panel" data-swap="${i}">
       <legend>${i+1}. ${s.q}</legend>
       <button class="choice" data-v="a"><span class="key">A</span><span>${s.a}</span></button>
       <button class="choice" data-v="b"><span class="key">B</span><span>${s.b}</span></button>
       <div class="out" aria-live="polite"></div>
     </fieldset>`).join("")}
 `, after: el => {
    el.querySelectorAll("[data-swap]").forEach(fs => {
      const s = swaps[+fs.dataset.swap];
      fs.querySelectorAll(".choice").forEach(c => c.addEventListener("click", () => {
        const ok = c.dataset.v === s.best;
        fs.querySelectorAll(".choice").forEach(x=>{x.classList.remove("picked","best","miss")});
        c.classList.add("picked", ok ? "best" : "miss");
        $(".out", fs).innerHTML = `<div class="fb ${ok?"best":"miss"}"><strong>${ok?"Yes, that one.":"Try the other one."}</strong><span>${s.why}</span></div>`;
      }));
    });
 }},

 { key:"quiz", label:"Knowledge check", render: () => `
   <p class="eyebrow">Objectives 1 to 4 · Check</p>
   <h2>Knowledge check</h2>
   <p>Five questions. You'll see the reasoning after each answer.</p>
   ${quiz.map((q,i)=>`
     <fieldset class="panel" data-q="${i}">
       <legend>${i+1}. ${q.q}</legend>
       ${q.o.map((o,j)=>`<button class="choice" data-j="${j}"><span class="key">${"ABC"[j]}</span><span>${o}</span></button>`).join("")}
       <div class="out" aria-live="polite"></div>
     </fieldset>`).join("")}
   <div class="panel" id="scorebox" aria-live="polite"><span class="muted">Your score appears here as you answer.</span></div>
   ${note("Evaluation", "Items map one-to-one to objectives 1 to 4; objective 5 is assessed in the scenarios. Distractors are the real mistakes from the scenarios, so a wrong answer points back to a specific screen. In an LMS build, results report to SCORM for item analysis.")}
 `, after: el => {
    el.querySelectorAll("[data-q]").forEach(fs => {
      const i = +fs.dataset.q, q = quiz[i];
      if (state.quiz[i] !== undefined) lockQuiz(fs, q, state.quiz[i]);
      fs.querySelectorAll(".choice").forEach(c => c.addEventListener("click", () => {
        if (state.quiz[i] !== undefined) return;
        state.quiz[i] = +c.dataset.j; lockQuiz(fs, q, +c.dataset.j); updateScore(el);
      }));
    });
    updateScore(el);
 }},
 { key:"card", label:"Pocket card", render: () => `
   <p class="eyebrow">Objective 5 · Practice aid</p>
   <h2>Keep this at the intake desk</h2>
   <div class="card" role="region" aria-label="Intake pocket card">
     <h3><span>PrEP-Ready Intake</span><span class="chip">Pocket card</span></h3>
     <section><h4>1 · Open</h4><p>"I ask everyone the same few questions about sexual health so we can see what services might help. Is that okay? You can skip any question."</p></section>
     <section><h4>2 · Ask</h4><ul class="clean"><li>Partners: genders, how many</li><li>Practices: oral, vaginal, anal; apps</li><li>Protection: condoms, PrEP</li><li>Past STIs and testing</li><li>Pregnancy intention</li></ul></section>
     <section><h4>3 · Listen for</h4><ul class="clean"><li>Bacterial STI in the past six months</li><li>Inconsistent condom use</li><li>Partner with HIV who is not virally suppressed, or status unknown</li><li>Sex in exchange for money, housing, or drugs</li><li>Shares injection equipment</li></ul></section>
     <section><h4>4 · Close</h4><p>Thank them. Name one thing they're already doing to protect themselves. Offer testing today and a warm handoff to PrEP navigation, in person if you can.</p></section>
   </div>
   ${note("Objective 5 · Job aid", "The card restates the module as a four-step routine that fits on a 4 x 6 card. 'Listen for' items follow CDC indications in plain language.")}
 `},

/* ---------- scenario engine ---------- */
function scenarioShell(s){
  return `
   <p class="eyebrow">Objectives 1, 2, 3, 5 · Branching scenario</p>
   <h2>Scenario: ${s.name}</h2>
   <div class="client">${portrait(s.id,"portrait lg")}<p>${s.setup}</p></div>
   <p class="credit">Photo: ${s.id==="marcus"?"Ante Emmanuel":"Ron Lach"}, Pexels. Posed by a model.</p>
   <div class="trust" id="tr-${s.id}"><div class="trust-top"><span class="trust-who">${portrait(s.id,"mini")}<b>${s.name}'s trust</b></span><span id="tl-${s.id}" aria-live="polite">Guarded</span></div><div class="meter" aria-hidden="true"><i id="tm-${s.id}"></i></div></div>
   <div class="dialog" id="dlg-${s.id}"></div>
   <div id="steps-${s.id}" style="display:flex;flex-direction:column;gap:14px"></div>
   ${note("Scenario design", "Each decision has one best, one partial, and one missed option, and every option gets feedback that explains the consequence instead of only marking it right or wrong. Learners can retry a step, so the scenario teaches instead of trapping them.")}`;
}
function runScenario(el, s){
  const dlg = $("#dlg-"+s.id, el), host = $("#steps-"+s.id, el);
  const mem = state["sc_"+s.id] || (state["sc_"+s.id] = []);
  dlg.innerHTML = ""; host.innerHTML = "";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const addLines = (lines, typing) => { const g=document.createElement("div"); g.className="dialog"; lines.forEach(([who,txt])=>{
    const me = who==="You", row=document.createElement("div"); row.className="line-row"+(me?" staff":"");
    const d=document.createElement("div"); d.className="line"+(me?" staff":"");
    row.innerHTML = portrait(me?"you":s.id,"mini"); row.appendChild(d);
    if (typing && !reduce && !me){ d.innerHTML=`<span class="typing" aria-hidden="true"><span></span><span></span><span></span></span>`; setTimeout(()=>{d.innerHTML=`<span class="who">${who}</span>${txt}`},850); }
    else d.innerHTML=`<span class="who">${who}</span>${txt}`;
    g.appendChild(row);
  }); host.appendChild(g); };
  state.trust = state.trust || {};
  if (state.trust[s.id]===undefined) state.trust[s.id]=25;
  const paintTrust = () => { const v=state.trust[s.id]; $("#tm-"+s.id, el).style.width=v+"%"; $("#tl-"+s.id, el).textContent = v>=80?"Open":v>=55?"Warming up":v>=35?"Guarded":"Closing off"; };
  paintTrust();
  const showStep = k => {
    const st = s.steps[k]; addLines(st.lines, mem[k]===undefined);
    const fs = document.createElement("fieldset"); fs.className="panel";
    fs.innerHTML = `<legend>${st.prompt}</legend>` + st.options.map((o,j)=>`<button class="choice" data-j="${j}"><span class="key">${"ABC"[j]}</span><span>${o.t}</span></button>`).join("") + `<div class="out" aria-live="polite"></div>`;
    host.appendChild(fs);
    const pick = (j, replay) => {
      const o = st.options[j];
      if (!replay){ state.trust[s.id] = Math.max(5, Math.min(100, state.trust[s.id] + ({best:20,okay:-5,miss:-15})[o.r])); paintTrust();
        const tr=$("#tr-"+s.id, el); tr.classList.remove("flash-up","flash-down"); void tr.offsetWidth; tr.classList.add(o.r==="best"?"flash-up":"flash-down"); }
      fs.querySelectorAll(".choice").forEach(x=>{x.disabled=true;x.classList.remove("picked","best","okay","miss")});
      const btn = fs.querySelector(`[data-j="${j}"]`); btn.classList.add("picked", o.r);
      const label = {best:"Strong choice.", okay:"Partly there.", miss:"Missed opportunity."}[o.r];
      $(".out", fs).innerHTML = `<div class="fb ${o.r}"><strong>${label}</strong><span>${o.f}</span>${o.r!=="best"?'<button class="retry">Try this step again</button>':""}</div>`;
      const rb = $(".retry", fs);
      if (rb) rb.addEventListener("click", () => { mem.length = k; runScenario(el, s); });
      if (o.r === "best") {
        mem[k] = j;
        addLines([["You", o.t.replace(/^"|"$/g,"")]], false);
        if (k+1 < s.steps.length) showStep(k+1);
        else { state.done.add(s.id); const end=document.createElement("div"); end.className="panel"; end.innerHTML=`<h3>${s.name} leaves with a plan</h3><p>${s.id==="marcus"?"Marcus meets the PrEP navigator before his result is ready and books a same-week appointment. Total extra time at intake: about four minutes.":"Amina agrees to testing today and takes the navigator's direct number. She asks whether her husband can call it too."}</p>`; host.appendChild(end); updateNav(); }
      } else { updateNav(); }
    };
    fs.querySelectorAll(".choice").forEach(c=>c.addEventListener("click",()=>pick(+c.dataset.j)));
    if (mem[k] !== undefined) pick(mem[k], true);
  };
  showStep(0);
}

/* ---------- quiz helpers ---------- */
function lockQuiz(fs, q, j){
  const ok = j === q.a;
  fs.querySelectorAll(".choice").forEach(x=>{x.disabled=true});
  fs.querySelector(`[data-j="${j}"]`).classList.add("picked", ok?"best":"miss");
  if(!ok) fs.querySelector(`[data-j="${q.a}"]`).classList.add("picked","best");
  $(".out", fs).innerHTML = `<div class="fb ${ok?"best":"miss"}"><strong>${ok?"Correct.":"Not quite. The correct answer is highlighted."}</strong><span>${q.why}</span></div>`;
}
function updateScore(el){
  const n = Object.keys(state.quiz).length; if(!n) return;
  const right = Object.entries(state.quiz).filter(([i,j])=>quiz[i].a===j).length;
  const C=2*Math.PI*44, off=C*(1-right/quiz.length);
  $("#scorebox", el).innerHTML = `<div class="scorewrap"><svg class="ring" viewBox="0 0 110 110" aria-hidden="true"><circle class="trk" cx="55" cy="55" r="44"/><circle class="val" cx="55" cy="55" r="44" stroke-dasharray="${C}" stroke-dashoffset="${C}"/><text x="55" y="64" text-anchor="middle">${right}/${quiz.length}</text></svg><span class="sr">${right} of ${quiz.length} correct.</span><span class="muted">${n<quiz.length?`${quiz.length-n} left to answer.`:(right>=4?"Ready for the pocket card.":"Review the screens linked to the items you missed, then retake on your next pass.")}</span></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const v=$("#scorebox .val", el); if(v) v.style.strokeDashoffset=off; }));
}

/* ---------- player ---------- */
const main = $("#main"), prog = $("#progress");
prog.innerHTML = screens.map(()=>"<span></span>").join("");
function gated(){
  const k = screens[state.i].key;
  if ((k==="marcus"||k==="amina") && !state.done.has(k)) return "Finish the scenario to continue";
  return "";
}
function updateNav(){
  $("#back").disabled = state.i===0;
  const g = gated(), last = state.i===screens.length-1;
  $("#next").disabled = !!g || last;
  $("#next").textContent = last ? "Complete" : "Next";
  $("#hint").textContent = g || screens[state.i].label;
}
let busy=false;
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function render(dir, focus){
  const s = screens[state.i];
  main.innerHTML = `<div class="stage"><section class="screen ${dir?"enter-"+dir+" build":""}" aria-labelledby="h-${s.key}">${s.render()}</section></div>`;
  const sec = main.querySelector(".screen");
  [...sec.children].forEach((c,k)=>c.style.setProperty("--i", Math.min(k,8)));
  const h = main.querySelector("h1,h2"); if (h) h.id = "h-"+s.key;
  if (s.after) s.after(main);
  [...prog.children].forEach((sp,j)=>sp.className = j<state.i?"done":(j===state.i?"now":""));
  $("#where").textContent = `Screen ${state.i+1} of ${screens.length}`;
  updateNav();
  try{ localStorage.setItem("prep-intake-screen", String(state.i)); }catch(e){}
  if (focus){ window.scrollTo({top:0,behavior:"auto"}); main.focus({preventScroll:true}); }
  if (dir) setTimeout(()=>{ sec.classList.remove("build","enter-next","enter-prev"); [...sec.children].forEach(c=>c.style.removeProperty("--i")); }, 1400);
}
function go(i, focus=true){
  const target = Math.max(0, Math.min(screens.length-1, i));
  if (busy) return;
  const first = !main.querySelector(".screen");
  const dir = first ? "" : (target > state.i ? "next" : target < state.i ? "prev" : "");
  state.i = target;
  if (!dir || reduceMotion()){ render(dir && !reduceMotion() ? dir : "", focus); return; }
  busy = true;
  main.querySelector(".screen").classList.add("leave-"+dir);
  setTimeout(()=>{ render(dir, focus); busy=false; }, 240);
}
document.addEventListener("keydown", e => {
  if (e.altKey||e.ctrlKey||e.metaKey) return;
  const t = e.target; if (t && (t.matches("input,textarea,select") || t.isContentEditable)) return;
  if (e.key==="ArrowRight" && !$("#next").disabled){ e.preventDefault(); go(state.i+1); }
  if (e.key==="ArrowLeft" && !$("#back").disabled){ e.preventDefault(); go(state.i-1); }
});
const hdr=document.querySelector("header.bar");
const setHdr=()=>document.documentElement.style.setProperty("--hdr", hdr.getBoundingClientRect().height+"px");
setHdr(); try{ new ResizeObserver(setHdr).observe(hdr); }catch(e){ addEventListener("resize",setHdr); }
$("#back").addEventListener("click",()=>go(state.i-1));
$("#next").addEventListener("click",()=>go(state.i+1));
$("#notesToggle").addEventListener("click", e => {
  const on = document.body.classList.toggle("notes");
  e.currentTarget.setAttribute("aria-pressed", String(on));
  e.currentTarget.textContent = on ? "Hide design notes" : "Show design notes";
});
let start = 0;
const hash = (location.hash||"").slice(1);
const hi = screens.findIndex(s=>s.key===hash);
if (hi>=0) start = hi;
go(start, false);
})();
</script>
